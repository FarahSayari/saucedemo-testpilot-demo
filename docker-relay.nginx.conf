worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=30s ipv6=off;
    server {
        listen 127.0.0.1:3000;
        set $saucedemo_upstream host.docker.internal:3000;
        proxy_pass $saucedemo_upstream;
        proxy_connect_timeout 3s;
        proxy_timeout 300s;
    }
}
